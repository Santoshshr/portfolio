<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Santosh Shrestha — Entrepreneur, Founder & Builder</title>
    <meta name="description" content="Santosh Shrestha is an entrepreneur and founder who builds ideas into real businesses and products. Exploring technology, ventures, and product building." />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Santosh Shrestha — Entrepreneur, Founder & Builder" />
    <meta property="og:description" content="Santosh Shrestha is an entrepreneur and founder who builds ideas into real businesses and products. Exploring technology, ventures, and product building." />
    <meta property="og:site_name" content="Santosh Shrestha" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Santosh Shrestha — Entrepreneur, Founder & Builder" />
    <meta name="twitter:description" content="Entrepreneur and founder building ideas into real businesses and products." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  </body>
</html>
